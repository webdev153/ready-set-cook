<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ready Set Cook!</title>
<meta name="theme-color" content="#ef5b4c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Ready Set Cook! — a fast-paced cooking game. Take orders, prep ingredients, serve dishes before time runs out!">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/sorceress/icon-512.png">
<link rel="apple-touch-icon" href="assets/sorceress/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="640"></canvas>

    <div id="overlays">
      <!-- HOME -->
      <div id="home" class="overlay show">
        <div class="home-topbar">
          <button id="dailyBtn" class="daily-chip" title="Daily reward">
            <span class="daily-ico" id="dailyIco">🎁</span>
            <span id="dailyLabel">+50</span>
            <span class="daily-streak" id="dailyStreak"></span>
          </button>
          <span class="coin-badge big"><img src="assets/sorceress/ui/coin.png" alt=""><span id="homeCoins">0</span></span>
        </div>
        <div class="chef-stand">
          <div class="chef-shadow"></div>
          <img id="heroChef" src="assets/sorceress/ui/hero-chef.png" alt="" class="hero-chef" onerror="this.style.display='none'">
        </div>
        <div class="logo">
          <span class="l1">READY</span>
          <span class="l2">SET</span>
          <span class="l3">COOK!</span>
        </div>
        <p class="tagline">The kitchen is open. Orders are coming. GO!</p>
        <p class="welcome" id="welcomeLine">Welcome, Chef!</p>
        <div class="special-card" id="specialCard"></div>
        <div class="menu-btns">
          <button id="homePlayBtn" class="btn primary">▶ PLAY</button>
          <button id="continueBtn" class="btn secondary" hidden>Continue · Level 1</button>
          <button id="homeLevelsBtn" class="btn secondary">🗺 Levels</button>
          <div class="menu-row">
            <button id="homeShopBtn" class="btn tertiary">🛒 Shop</button>
            <button id="homeAchBtn" class="btn tertiary">🏆 Trophies</button>
          </div>
        </div>
        <div class="home-cards">
          <span class="stat-card">⭐ High Score <b id="bestScore">0</b></span>
          <span class="stat-card">Level <b id="homeLevel">1</b></span>
          <span class="stat-card">⭐ <b id="homeStars">0</b> stars</span>
        </div>
      </div>

      <!-- ACHIEVEMENTS -->
      <div id="achiev" class="overlay">
        <div class="screen-head">
          <button id="achBackBtn" class="btn small">‹ HOME</button>
          <h2 class="screen-title">🏆 Achievements</h2>
          <span class="coin-badge"><img src="assets/sorceress/ui/coin.png" alt=""><span id="achCoins">0</span></span>
        </div>
        <div id="achList" class="ach-list"></div>
      </div>

      <!-- LEVELS -->
      <div id="levels" class="overlay">
        <div class="screen-head">
          <button id="levelsBackBtn" class="btn small">‹ HOME</button>
          <h2 class="screen-title">Select Level</h2>
          <span class="coin-badge"><img src="assets/sorceress/ui/coin.png" alt=""><span id="levelsCoins">0</span></span>
        </div>
        <div id="levelGrid" class="level-grid"></div>
        <div class="booster-wrap">
          <p class="booster-title">Boosters (tap to activate for the next level)</p>
          <div id="boosterStrip" class="booster-strip"></div>
        </div>
      </div>

      <!-- SHOP -->
      <div id="shop" class="overlay">
        <div class="screen-head">
          <button id="shopBackBtn" class="btn small">‹ HOME</button>
          <h2 class="screen-title">Shop</h2>
          <span class="coin-badge"><img src="assets/sorceress/ui/coin.png" alt=""><span id="shopCoins">0</span></span>
        </div>
        <div id="shopList" class="shop-list"></div>
      </div>

      <!-- PAUSE -->
      <div id="pause" class="overlay">
        <h1>⏸ PAUSED</h1>
        <p class="subline" id="pauseInfo"></p>
        <div class="res-btns">
          <button id="resumeBtn" class="btn">▶ RESUME</button>
          <button id="restartBtn" class="btn alt">↻ RESTART</button>
          <button id="pauseHomeBtn" class="btn alt">🏠 HOME</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="results" class="overlay">
        <h1 id="resTitle">👨‍🍳 LEVEL COMPLETE!</h1>
        <div id="stars" class="stars"></div>
        <p class="rank" id="rank"></p>
        <p class="bigscore" id="finalScore"></p>
        <p class="subline" id="coinsEarned"></p>
        <p class="bestline">Best: <span id="bestFinal"></span></p>
        <div class="res-btns">
          <button id="retryBtn" class="btn alt">↻ RETRY</button>
          <button id="nextBtn" class="btn">NEXT LEVEL ▶</button>
          <button id="homeBtn" class="btn alt">🏠 HOME</button>
        </div>
      </div>
    </div>

    <button id="pauseBtn" title="Pause (P)">⏸</button>
    <button id="muteBtn" title="Mute (M)">🔊</button>
    <div id="tutorial" class="tutorial" hidden></div>
    <div id="rotateHint">🔄 Rotate your device — landscape is best!</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
